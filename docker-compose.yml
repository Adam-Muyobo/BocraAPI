services:
  mysql:
    image: mysql:8.0.41
    container_name: bocra-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bocra_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bocra
      MYSQL_PASSWORD: bocra
    ports:
      - "3306:3306"
    volumes:
      - bocra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bocra-api-docker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bocra_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: bocra
      SPRING_DATASOURCE_PASSWORD: bocra
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: change-me-change-me-change-me-change-me
      JWT_EXPIRATION: 3600000
      REFRESH_TOKEN_EXPIRATION: 1209600000
      EMAIL_VERIFICATION_EXPIRATION: 86400000
      EMAIL_VERIFICATION_LOG_GENERATED_TOKEN: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3010,http://127.0.0.1:3010
      DEMO_DATA_ENABLED: "true"
    ports:
      - "8081:8080"

volumes:
  bocra_mysql_data:
