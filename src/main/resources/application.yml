# Configures environment-driven runtime settings for local and deployed BOCRA API instances.
spring:
  application:
    name: BocraAPI
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bocra_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

application:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      expiration-ms: ${JWT_EXPIRATION:3600000}
    refresh-token:
      expiration-ms: ${REFRESH_TOKEN_EXPIRATION:1209600000}
    email-verification:
      expiration-ms: ${EMAIL_VERIFICATION_EXPIRATION:86400000}
      log-generated-token: ${EMAIL_VERIFICATION_LOG_GENERATED_TOKEN:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
